name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip source package
        run: unzip SpeedTestAndroid-TermuxCore.zip

      - name: 打印全部文件和文件夹
        run: |
          ls -la
          echo "===== 进入文件夹查看 ====="
          ls -la */

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          
      - name: Build Debug APK
        run: |
          # 自动找到 SpeedTestAndroid 目录
          cd $(find . -type d -name "SpeedTestAndroid" | head -1)
          gradle assembleDebug

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: **/app/build/outputs/apk/debug/app-debug.apk
