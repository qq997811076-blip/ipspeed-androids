name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip source package
        run: unzip SpeedTestAndroid-TermuxCore.zip

      - name: List dir
        run: ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          cd SpeedTestAndroid-TermuxCore/SpeedTestAndroid
          gradle assembleDebug

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: SpeedTestAndroid-TermuxCore/SpeedTestAndroid/app/build/outputs/apk/debug/app-debug.apk
